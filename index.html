  <!-- 3D Script -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.set(0, 2, 125);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector('#bg-canvas'),
      antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(10, 20, 30);
    scene.add(ambientLight, pointLight);

    // Starfield
    const starGeometry = new THREE.BufferGeometry();
    const starVertices = [];
    for (let i = 0; i < 5000; i++) {
      const x = (Math.random() - 0.5) * 2000;
      const y = (Math.random() - 0.5) * 2000;
      const z = (Math.random() - 0.5) * 2000;
      if (Math.sqrt(x*x + y*y + z*z) > 100) {
        starVertices.push(x, y, z);
      }
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Saturn
    const textureLoader = new THREE.TextureLoader();
    const saturnTexture = textureLoader.load('images/2k_saturn.jpg');
    const ringTexture = textureLoader.load('images/Saturn_Rings.png');

    const saturn = new THREE.Mesh(
      new THREE.SphereGeometry(64, 64, 64),
      new THREE.MeshStandardMaterial({ map: saturnTexture, roughness: 1 })
    );
    saturn.position.set(-10, 0, -100);
    scene.add(saturn);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(75, 125, 100),
      new THREE.MeshBasicMaterial({
        map: ringTexture,
        // color: 0xaaaaff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7 })
    );
    ring.position.set(-10,0,-100)
    ring.rotation.x = - (Math.PI) / 2.5;

    ring.position.copy(saturn.position);
    // ring.rotation.x += 0.5;
    scene.add(ring);

    // Endurance Model
    const loader = new GLTFLoader();
    loader.load('models/interstellar__endurance.glb', (gltf) => {
      const model = gltf.scene;
      model.scale.set(1.2, 1.2, 1.2);
      model.position.set(0, 0, 5);
      scene.add(model);

      // Scroll-based animation
      document.body.onscroll = () => {
        const t = document.body.getBoundingClientRect().top;
        // model.rotation.y = Math.PI / 1.5;
        model.rotation.z = Math.PI / 1.5;
        model.rotation.x = t * 0.0003;
        model.position.y = t * 0.0015;
        camera.position.z = 125 + t * 0.045;
      };
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      stars.rotation.y += 0.0003;
      saturn.rotation.y += 0.0004;
      ring.rotation.z += 0.0002;
      renderer.render(scene, camera);
    }
    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- FADE IN SECTIONS ON SCROLL ---
    const sections = document.querySelectorAll('.section-container');
    const observer = new IntersectionObserver((entries) =>{
        entries.forEach(entry => {
            if (entry.isIntersecting){
                entry.target.classList.add('visible');
            }
        });
    }, {threshold: 0.1});

    sections.forEach(section => {
        observer.observe(section);
    });
  </script>

  <script>
    // Scroll-driven clean left-to-right reveal.
    (() => {
      const header = document.getElementById('header');
      const revealRect = document.getElementById('worm-reveal-rect');
      if (!header || !revealRect) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const smooth = t => t * t * (3 - 2 * t);

      const render = () => {
        if (reduceMotion.matches) {
          revealRect.setAttribute('width', '1000');
          return;
        }

        const rect = header.getBoundingClientRect();
        const vh = window.innerHeight;

        const start = vh * 0.96;
        const end = vh * 0.40;
        const raw = clamp((start - rect.top) / (start - end), 0, 1);
        const p = smooth(raw);

        revealRect.setAttribute('width', String(1000 * p));
      };

      let raf = 0;
      const schedule = () => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          render();
        });
      };

      render();
      window.addEventListener('scroll', schedule, { passive: true });
      window.addEventListener('resize', schedule);
      reduceMotion.addEventListener?.('change', schedule);
    })();
  </script>
