<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Sourav Ghosh regarding aerospace research, engineering, or collaboration.">
  <title>Contact | Sourav Ghosh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/site.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"}}</script>
  <script type="module" src="assets/js/site.js"></script>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <site-header root="." current="contact"></site-header>

  <main class="page-shell">
    <section class="page-hero">
      <h1>Contact</h1>
      <p>For research discussions, technical collaboration, speaking, or project inquiries.</p>
    </section>

    <section class="section-container">
      <div class="glass-card">
        <form action="https://formspree.io/f/movlnnna" method="POST" class="form-grid">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="7" required></textarea>
          </div>
          <div class="button-row">
            <button class="button primary" type="submit">Send message</button>
            <a class="button" href="mailto:sg.souravghosh2002@gmail.com">Email directly</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
  <script type="module" src="assets/js/starfield.js"></script>
</body>
</html>
