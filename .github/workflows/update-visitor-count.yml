name: Update public visitor count

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-visitor-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch GoatCounter's public total
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          url = "https://souravius1234.goatcounter.com/counter/TOTAL.json"
          request = urllib.request.Request(url, headers={"User-Agent": "site-visitor-counter/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          raw = str(data["count"])
          if not re.fullmatch(r"[0-9][0-9,]*", raw):
              raise ValueError(f"Invalid GoatCounter count: {raw!r}")
          count = int(raw.replace(",", ""))

          # Date boundaries are computed in Japan Standard Time.
          jst = timezone(timedelta(hours=9))
          today = datetime.now(jst).date().isoformat()
          daily_url = url + "?" + urllib.parse.urlencode({"start": today, "end": today})
          daily_request = urllib.request.Request(daily_url, headers={"User-Agent": "site-visitor-counter/1.0"})
          with urllib.request.urlopen(daily_request, timeout=30) as response:
              daily_data = json.load(response)
          daily_raw = str(daily_data["count"])
          if not re.fullmatch(r"[0-9][0-9,]*", daily_raw):
              raise ValueError(f"Invalid daily GoatCounter count: {daily_raw!r}")
          today_count = int(daily_raw.replace(",", ""))
          if today_count > count:
              raise ValueError("Daily count exceeds total count")

          path = pathlib.Path("data/visitor-count.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({"count": f"{count:,}", "today": f"{today_count:,}", "date": today}) + "\n", encoding="utf-8")
          print(f"Public visitor count: {count:,}; today ({today} JST): {today_count:,}")
          PY

      - name: Commit the updated snapshot
        id: publish
        run: |
          if git diff --quiet -- data/visitor-count.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in published count."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor-count.json
          git commit -m "Update public visitor count"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN commits alone do not trigger Pages' branch-source publishing.
      # Explicitly request the build after changing the snapshot.
      - name: Request GitHub Pages rebuild
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
